name: Build PPSSPP Wii U

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 오래된 devkitPPC 이미지 태그들 (존재 여부는 Docker Hub devkitpro/devkitppc 태그 목록에서 확인)
        image_tag: ["20180811", "20190212", "20190524", "20200528"]
    container:
      image: devkitpro/devkitppc:${{ matrix.image_tag }}
    steps:
      - name: Install build tools
        run: |
          (apt-get update || true)
          apt-get install -y cmake build-essential git python3 zlib1g-dev pkg-config ccache || true
          cmake --version
          git --version

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build rpltool (host tool)
        run: |
          sed -i 's/-Werror[^ ]*//g' ext/wiiu/rpltool/Makefile
          make -C ext/wiiu/rpltool

      - name: Configure
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          mkdir -p build && cd build
          cmake -DWIIU=ON ..

      - name: Compile
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          cd build
          make -j$(nproc) 2>&1 | tee ../build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.image_tag }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload rpx
        uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-WiiU-${{ matrix.image_tag }}
          path: |
            build/**/*.rpx

            build/**/*.elf
