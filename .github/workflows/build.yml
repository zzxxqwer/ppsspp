name: Build PPSSPP Wii U

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "devkitpro/devkitppc 도커 이미지 태그 (예: latest, 20190212)"
        default: "latest"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:${{ github.event.inputs.image_tag || 'latest' }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y cmake build-essential git python3 zlib1g-dev pkg-config ccache

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build rpltool (host tool)
        run: |
          ls ext/wiiu/rpltool
          make -C ext/wiiu/rpltool

      - name: Configure
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          mkdir -p build && cd build
          cmake -DWIIU=ON ..

      - name: Compile
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          cd build
          make -j$(nproc) 2>&1 | tee ../build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload rpx
        uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-WiiU
          path: |
            build/**/*.rpx

            build/**/*.elf
